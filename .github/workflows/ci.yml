name: Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Automated Test Suite (CRDT, Awareness, Perms, Schema)
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://vdfprwerslivqcmbsvlc.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkZnByd2Vyc2xpdnFjbWJzdmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzM2ODksImV4cCI6MjEwMjc0OTY4OX0.dCcf_Stlw_dK-Q7ZSwpzp3lLALyQyRyvBSPjBrs5m9Q' }}

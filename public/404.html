<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Docs Clone</title>
    <script type="text/javascript">
      // Single Page Application (SPA) 404 Fallback for GitHub Pages
      // Captures the full requested path, query string, and hash, then redirects to the SPA root with ?p=
      (function () {
        var repoPrefix = "/Docsie";
        var l = window.location;
        var pathname = l.pathname;
        var isRepo = pathname === repoPrefix || pathname.startsWith(repoPrefix + "/");
        var prefix = isRepo ? repoPrefix : "";
        var subPath = isRepo ? pathname.slice(repoPrefix.length) : pathname;
        if (!subPath.startsWith("/")) {
          subPath = "/" + subPath;
        }

        var fullTarget = subPath + l.search + l.hash;
        var destination = prefix + "/?p=" + encodeURIComponent(fullTarget);
        l.replace(destination);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f9fbfd;
        color: #5f6368;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e8f0fe;
        border-top: 3px solid #1a73e8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .text {
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <div class="text">Redirecting to Google Docs Clone...</div>
    </div>
  </body>
</html>
